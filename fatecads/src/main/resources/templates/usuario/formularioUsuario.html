<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Cadastro de Usuário
  </title>
  <link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/>
 </head>
 <body class="app-page">
  <th:block th:replace="~{fragments/layout :: navigation('usuario')}">
  </th:block>
  <main class="container" id="main-content">
   <div class="logo">
    <img alt="" aria-hidden="true" class="icon" height="22" src="/images/icons/users.svg" th:src="@{/images/icons/users.svg}" width="22"/>
   </div>
   <h1>
    Cadastro de Usuário
   </h1>
   <p class="subtitulo">
    Crie sua conta para acessar o sistema
   </p>
   <form class="data-form" method="post" th:action="@{/usuarios/salvar}" th:object="${usuario}">
    <input th:field="*{idUsuario}" type="hidden"/>
    <div class="field">
     <label for="nome">
      Nome
     </label>
     <input id="nome" placeholder="Digite seu nome" required="" th:field="*{nomeUsuario}" type="text"/>
    </div>
    <div class="field">
     <label for="email">
      Email
     </label>
     <input id="email" placeholder="Digite seu email" required="" th:field="*{emailUsuario}" type="email"/>
    </div>
    <div class="field">
     <label for="login">
      Login
     </label>
     <input id="login" placeholder="Escolha um login" required="" th:field="*{loginUsuario}" type="text"/>
    </div>
    <div class="field">
     <label for="senha">
      Senha
     </label>
     <input id="senha" placeholder="Crie uma senha" required="" th:field="*{senhaUsuario}" type="password"/>
    </div>
    <div class="field">
     <label for="role">
      Perfil de Acesso
     </label>
     <select id="role" name="role" th:field="*{role}">
      <option value="ROLE_USER">
       Usuário (gestão)
      </option>
      <option value="ROLE_ADMIN">
       Administrador
      </option>
      <option value="ROLE_CLIENTE">
       Cliente (loja)
      </option>
     </select>
    </div>
    <div class="form-actions">
     <input class="botao" type="submit" value="Criar Conta"/>
     <a class="voltar" href="/fatecads">
      Cancelar
     </a>
    </div>
   </form>
   <div th:replace="~{fragments/layout :: credit}">
   </div>
  </main>
 </body>
</html>
