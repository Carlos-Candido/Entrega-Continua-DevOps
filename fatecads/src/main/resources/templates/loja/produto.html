<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title th:text="${produto.descricaoProduto + ' | Loja FatecADS'}">Produto | Loja FatecADS</title><link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/></head>
<body class="app-page loja-page"><th:block th:replace="~{fragments/layout :: storefront('produtos')}"></th:block><main class="container" id="main-content"><a class="back-link" th:href="@{/loja/produtos}">← Produtos</a><section class="product-detail"><div class="product-gallery"><img alt="Imagem do produto" th:if="${produto.imagemProduto != null}" th:src="@{/produtos/imagem/{id}(id=${produto.idProduto})}"/><div class="product-image-placeholder" th:unless="${produto.imagemProduto != null}">Sem imagem</div></div><div class="product-info"><span class="card-produto-marca" th:text="${produto.marcaProduto}">Categoria</span><h1 th:text="${produto.descricaoProduto}">Produto</h1><p th:text="${produto.unidadeProduto}">Unidade</p><strong class="product-price" th:text="${'R$ ' + #numbers.formatDecimal(produto.valorProduto, 1, 2)}">R$ 0,00</strong><form class="product-add-form" method="post" th:action="@{/loja/carrinho/adicionar/{id}(id=${produto.idProduto})}"><input name="retorno" th:value="@{/loja/produto/{id}(id=${produto.idProduto})}" type="hidden"/><label for="quantidade">Quantidade</label><input id="quantidade" min="1" name="quantidade" type="number" value="1"/><button type="submit">Adicionar ao carrinho</button></form></div></section><div th:replace="~{fragments/layout :: credit}"></div></main></body></html>
