<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Pedido confirmado | Loja FatecADS</title><link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/></head>
<body class="app-page loja-page"><th:block th:replace="~{fragments/layout :: storefront('loja')}"></th:block><main class="container" id="main-content"><section class="confirmation"><p class="eyebrow">PEDIDO CONFIRMADO</p><h1>Compra simulada concluída.</h1><p class="mensagem sucesso">Pedido realizado com sucesso!</p><p th:text="${'Pedido nº ' + pedido.idPedido}">Pedido nº 0</p><div class="confirmation-items"><article th:each="item : ${itens}"><span th:text="${item.produto.descricaoProduto}">Produto</span><span th:text="${item.quantidade + ' × R$ ' + #numbers.formatDecimal(item.preco, 1, 2)}">1 × R$ 0,00</span><strong th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 2)}">R$ 0,00</strong></article></div><div class="confirmation-total"><span>Total</span><strong id="totalPedido" th:text="${'R$ ' + #numbers.formatDecimal(total, 1, 2)}">R$ 0,00</strong></div><a class="btn-novo" th:href="@{/loja}">Voltar para a loja</a></section><div th:replace="~{fragments/layout :: credit}"></div></main></body></html>
