<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Carrinho | Loja FatecADS</title><link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/></head>
<body class="app-page loja-page"><th:block th:replace="~{fragments/layout :: storefront('carrinho')}"></th:block><main class="container" id="main-content"><header class="store-page-heading"><h1>Carrinho</h1><p>Revise seus itens antes de finalizar a compra.</p></header>
<section class="cart-page" th:if="${not #lists.isEmpty(itens)}"><div class="cart-list"><article class="cart-line" th:each="item : ${itens}"><img alt="" th:if="${item.produto.imagemProduto != null}" th:src="@{/produtos/imagem/{id}(id=${item.produto.idProduto})}"/><div class="cart-image-placeholder" th:unless="${item.produto.imagemProduto != null}">Sem imagem</div><div class="cart-line-info"><a th:href="@{/loja/produto/{id}(id=${item.produto.idProduto})}" th:text="${item.produto.descricaoProduto}">Produto</a><span th:text="${item.produto.marcaProduto}">Categoria</span><strong th:text="${'R$ ' + #numbers.formatDecimal(item.preco, 1, 2)}">R$ 0,00</strong></div><form class="cart-quantity" method="post" th:action="@{/loja/carrinho/alterar/{id}(id=${item.produto.idProduto})}"><label class="sr-only" th:for="${'quantidade-' + item.produto.idProduto}">Quantidade</label><input min="1" name="quantidade" th:id="${'quantidade-' + item.produto.idProduto}" th:value="${item.quantidade}" type="number"/><button type="submit">Atualizar</button></form><strong class="cart-line-total" th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 2)}">R$ 0,00</strong><form method="post" th:action="@{/loja/carrinho/remover/{id}(id=${item.produto.idProduto})}"><button class="link-button" type="submit">Remover</button></form></article></div><aside class="cart-summary"><div><span>Subtotal</span><strong th:text="${'R$ ' + #numbers.formatDecimal(subtotal, 1, 2)}">R$ 0,00</strong></div><div><span>Total</span><strong id="totalPedido" th:text="${'R$ ' + #numbers.formatDecimal(total, 1, 2)}">R$ 0,00</strong></div><form method="post" th:action="@{/loja/finalizar}"><button type="submit">Finalizar compra</button></form><a th:href="@{/loja/produtos}">Continuar comprando</a></aside></section><section class="store-empty empty-cart" th:if="${#lists.isEmpty(itens)}"><h2>Seu carrinho está vazio</h2><p>Adicione produtos para vê-los aqui.</p><a class="btn-novo" th:href="@{/loja/produtos}">Ver produtos</a></section><div th:replace="~{fragments/layout :: credit}"></div></main></body></html>
