<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Produtos | Loja FatecADS</title><link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/></head>
<body class="app-page loja-page"><th:block th:replace="~{fragments/layout :: storefront('produtos')}"></th:block><main class="container" id="main-content"><header class="store-page-heading"><h1>Produtos</h1><p>Explore o catálogo e escolha o que precisa.</p></header>
<form class="store-filter" method="get" th:action="@{/loja/produtos}"><label class="sr-only" for="q">Buscar produtos</label><input id="q" name="q" placeholder="Buscar produtos" th:value="${termo}" type="search"/><label class="sr-only" for="marca">Categoria</label><select id="marca" name="marca"><option value="">Todas as categorias</option><option th:each="marca : ${marcas}" th:selected="${marca == marcaSelecionada}" th:text="${marca}" th:value="${marca}">Categoria</option></select><button type="submit">Filtrar</button></form>
<section class="store-categories" id="categorias"><div class="category-list"><a class="category-chip" th:href="@{/loja/produtos}">Todos</a><a class="category-chip" th:each="marca : ${marcas}" th:href="@{/loja/produtos(marca=${marca})}" th:text="${marca}">Categoria</a></div></section>
<section class="store-products"><div class="menu-produtos"><article class="card-produto" th:each="produto : ${produtos}"><a class="product-link" th:href="@{/loja/produto/{id}(id=${produto.idProduto})}"><img alt="Imagem do produto" class="card-produto-imagem" th:if="${produto.imagemProduto != null}" th:src="@{/produtos/imagem/{id}(id=${produto.idProduto})}"/><span class="card-produto-sem-imagem" th:unless="${produto.imagemProduto != null}">Sem imagem</span><span class="card-produto-marca" th:text="${produto.marcaProduto}">Categoria</span><strong class="card-produto-nome" th:text="${produto.descricaoProduto}">Produto</strong><span class="card-produto-preco" th:text="${'R$ ' + #numbers.formatDecimal(produto.valorProduto, 1, 2)}">R$ 0,00</span></a><form method="post" th:action="@{/loja/carrinho/adicionar/{id}(id=${produto.idProduto})}"><input name="retorno" th:value="@{/loja/produtos}" type="hidden"/><button type="submit">Adicionar</button></form></article></div><p class="store-empty" th:if="${#lists.isEmpty(produtos)}">Nenhum produto encontrado com esses filtros.</p></section><div th:replace="~{fragments/layout :: credit}"></div></main></body></html>
