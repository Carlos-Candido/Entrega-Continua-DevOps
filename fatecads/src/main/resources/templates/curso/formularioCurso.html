<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Cadastro de Cursos
  </title>
  <link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/>
 </head>
 <body class="app-page">
  <th:block th:replace="~{fragments/layout :: navigation('curso')}">
  </th:block>
  <main class="container" id="main-content">
   <div class="logo">
    <img alt="" aria-hidden="true" class="icon" height="22" src="/images/icons/book-alt.svg" th:src="@{/images/icons/book-alt.svg}" width="22"/>
   </div>
   <h1>
    Cadastro de Cursos
   </h1>
   <p class="subtitulo">
    Cadastre ou atualize os dados do curso
   </p>
   <form class="data-form" method="post" th:action="@{/cursos/salvar}" th:object="${curso}">
    <input th:field="*{idCurso}" type="hidden"/>
    <div class="field">
     <label for="nomeCurso">
      Nome
     </label>
     <input id="nomeCurso" placeholder="Digite o nome do curso" required="" th:field="*{nomeCurso}" type="text"/>
    </div>
    <div class="field">
     <label for="periodoCurso">
      Período
     </label>
     <input id="periodoCurso" placeholder="Ex: Noturno" required="" th:field="*{periodoCurso}" type="text"/>
    </div>
    <div class="field">
     <label for="cargaHorariaCurso">
      Carga Horária
     </label>
     <input id="cargaHorariaCurso" min="1" placeholder="Ex: 2800" required="" th:field="*{cargaHorariaCurso}" type="number"/>
    </div>
    <div class="form-actions">
     <input class="botao" type="submit" value="Salvar Curso"/>
     <a class="voltar" href="/cursos/listar">
      Cancelar
     </a>
    </div>
   </form>
   <div th:replace="~{fragments/layout :: credit}">
   </div>
  </main>
 </body>
</html>
