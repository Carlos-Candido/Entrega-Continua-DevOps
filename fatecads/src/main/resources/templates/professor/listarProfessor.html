<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Lista de Professores
  </title>
  <link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/>
 </head>
 <body class="app-page">
  <th:block th:replace="~{fragments/layout :: navigation('professor')}">
  </th:block>
  <main class="container" id="main-content">
   <div class="cabecalho">
    <div class="titulo-area">
     <div class="icone">
      <img alt="" aria-hidden="true" class="icon" height="22" src="/images/icons/chalkboard-user.svg" th:src="@{/images/icons/chalkboard-user.svg}" width="22"/>
     </div>
     <div>
      <h1>
       Lista de Professores
      </h1>
      <p class="subtitulo">
       Gerencie os professores cadastrados no sistema
      </p>
     </div>
    </div>
    <a class="btn-novo" href="/professores/criar">
     + Novo Professor
    </a>
   </div>
   <div class="tabela-card">
    <div aria-label="Tabela: role horizontalmente para ver todas as colunas" class="tabela-scroll" role="region" tabindex="0">
     <table>
      <thead>
       <tr>
        <th scope="col">
         ID
        </th>
        <th scope="col">
         Nome
        </th>
        <th scope="col">
         Telefone
        </th>
        <th scope="col">
         Graduação
        </th>
        <th scope="col">
         RM
        </th>
        <th scope="col">
         Ações
        </th>
       </tr>
      </thead>
      <tbody>
       <tr th:each="professor : ${professores}">
        <td class="id" th:text="${professor.idProfessor}">
         *
        </td>
        <td th:text="${professor.nomeProfessor}">
         *
        </td>
        <td th:text="${professor.telefoneProfessor}">
         *
        </td>
        <td>
         <span class="graduacao" th:text="${professor.graduacaoProfessor}">
          *
         </span>
        </td>
        <td th:text="${professor.rmProfessor}">
         *
        </td>
        <td>
         <div class="acoes">
          <a class="editar" th:href="@{/professores/editar/{id}(id=${professor.idProfessor})}">
           Editar
          </a>
          <a class="excluir" th:href="@{/professores/excluir/{id}(id=${professor.idProfessor})}">
           Excluir
          </a>
         </div>
        </td>
       </tr>
       <tr class="empty-row" th:if="${#lists.isEmpty(professores)}">
        <td colspan="6">
         <strong>
          Nenhum registro cadastrado
         </strong>
         Use o botão de cadastro acima para adicionar o primeiro registro.
        </td>
       </tr>
      </tbody>
     </table>
    </div>
   </div>
   <div class="rodape">
    FatecADS • Gerenciamento de Professores
   </div>
   <div th:replace="~{fragments/layout :: credit}">
   </div>
  </main>
 </body>
</html>
