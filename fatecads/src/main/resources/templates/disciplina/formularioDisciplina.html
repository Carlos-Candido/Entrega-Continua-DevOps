<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Cadastro de Disciplinas
  </title>
  <link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/>
 </head>
 <body class="app-page">
  <th:block th:replace="~{fragments/layout :: navigation('disciplina')}">
  </th:block>
  <main class="container" id="main-content">
   <div class="logo">
    <img alt="" aria-hidden="true" class="icon" height="22" src="/images/icons/book.svg" th:src="@{/images/icons/book.svg}" width="22"/>
   </div>
   <h1>
    Cadastro de Disciplinas
   </h1>
   <p class="subtitulo">
    Cadastre ou atualize os dados da disciplina
   </p>
   <form class="data-form" method="post" th:action="@{/disciplinas/salvar}" th:object="${disciplina}">
    <input th:field="*{idDisciplina}" type="hidden"/>
    <div class="field">
     <label for="nomeDisciplina">
      Nome
     </label>
     <input id="nomeDisciplina" placeholder="Digite o nome da disciplina" required="" th:field="*{nomeDisciplina}" type="text"/>
    </div>
    <div class="field">
     <label for="siglaDisciplina">
      Sigla
     </label>
     <input id="siglaDisciplina" placeholder="Ex: POO" required="" th:field="*{siglaDisciplina}" type="text"/>
    </div>
    <div class="field">
     <label for="cargaHorariaDisciplina">
      Carga Horária
     </label>
     <input id="cargaHorariaDisciplina" min="1" placeholder="Ex: 80" required="" th:field="*{cargaHorariaDisciplina}" type="number"/>
    </div>
    <div class="field">
     <label for="curso">
      Curso
     </label>
     <select id="curso" required="" th:field="*{curso}">
      <option disabled="" value="">
       Selecione um curso
      </option>
      <option th:each="curso : ${cursos}" th:text="${curso.nomeCurso}" th:value="${curso.idCurso}">
      </option>
     </select>
    </div>
    <div class="field">
     <label for="professor">
      Professor
     </label>
     <select id="professor" required="" th:field="*{professor}">
      <option disabled="" value="">
       Selecione um professor
      </option>
      <option th:each="professor : ${professores}" th:text="${professor.nomeProfessor}" th:value="${professor.idProfessor}">
      </option>
     </select>
    </div>
    <div class="form-actions">
     <input class="botao" type="submit" value="Salvar Disciplina"/>
     <a class="voltar" href="/disciplinas/listar">
      Cancelar
     </a>
    </div>
   </form>
   <div th:replace="~{fragments/layout :: credit}">
   </div>
  </main>
 </body>
</html>
