<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Acesso ao Sistema
  </title>
  <link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/>
 </head>
 <body class="auth-page login-editorial">
  <aside class="login-manifesto" aria-label="FatecADS">
   <a class="brand" href="/fatecads">
    <img alt="" aria-hidden="true" class="icon brand-mark" height="32" src="/images/fatecads-mark.svg" th:src="@{/images/fatecads-mark.svg}" width="32"/>
    FatecADS
   </a>
   <p class="eyebrow">AMBIENTE ACADÊMICO</p>
   <h1>Conhecimento organizado para quem constrói o próximo capítulo.</h1>
   <div class="manifesto-grid" aria-hidden="true"><span>01</span><i></i><b></b></div>
  </aside>
  <main class="container" id="main-content">
   <h1>
    Acesso ao Sistema
   </h1>
   <p class="subtitulo">
    Entre com suas credenciais para continuar
   </p>
   <form method="post" th:action="@{/login}">
    <label for="username">
     Usuário
    </label>
    <input autocomplete="username" id="username" name="username" placeholder="Digite seu usuário" required="" type="text"/>
    <label for="password">
     Senha
    </label>
    <input autocomplete="current-password" id="password" name="password" placeholder="Digite sua senha" required="" type="password"/>
    <button type="submit">
     Entrar
    </button>
   </form>
   <p class="mensagem erro" role="alert" th:if="${param.error}">
    Usuário ou senha inválidos
   </p>
   <p class="mensagem sucesso" role="status" th:if="${param.logout}">
    Logout efetuado com sucesso
   </p>
   <div class="linha">
   </div>
   <form action="/fatecads" method="get">
    <button class="btn-home" type="submit">
     Voltar para Home
    </button>
   </form>
   <div th:replace="~{fragments/layout :: credit}">
   </div>
  </main>
 </body>
</html>
