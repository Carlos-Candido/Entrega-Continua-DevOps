<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Cadastro de Alunos
  </title>
  <link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/>
 </head>
 <body class="app-page">
  <th:block th:replace="~{fragments/layout :: navigation('aluno')}">
  </th:block>
  <main class="container" id="main-content">
   <div class="logo">
    <img alt="" aria-hidden="true" class="icon" height="22" src="/images/icons/graduation-cap.svg" th:src="@{/images/icons/graduation-cap.svg}" width="22"/>
   </div>
   <h1>
    Cadastro de Alunos
   </h1>
   <p class="subtitulo">
    Cadastre ou atualize os dados do aluno
   </p>
   <form class="data-form" method="post" th:action="@{/alunos/salvar}" th:object="${aluno}">
    <input th:field="*{idAluno}" type="hidden"/>
    <div class="field">
     <label for="nomeAluno">
      Nome
     </label>
     <input id="nomeAluno" placeholder="Digite o nome completo" required="" th:field="*{nomeAluno}" type="text"/>
    </div>
    <div class="field">
     <label for="emailAluno">
      Email
     </label>
     <input id="emailAluno" placeholder="exemplo@email.com" required="" th:field="*{emailAluno}" type="email"/>
    </div>
    <div class="field">
     <label for="telefoneAluno">
      Telefone
     </label>
     <input id="telefoneAluno" placeholder="(00) 00000-0000" required="" th:field="*{telefoneAluno}" type="tel"/>
    </div>
    <div class="field">
     <label for="cpfAluno">
      CPF
     </label>
     <input id="cpfAluno" placeholder="000.000.000-00" required="" th:field="*{cpfAluno}" type="text"/>
    </div>
    <div class="field">
     <label for="enderecoAluno">
      Endereço
     </label>
     <input id="enderecoAluno" placeholder="Digite o endereço do aluno" required="" th:field="*{enderecoAluno}" type="text"/>
    </div>
    <div class="field">
     <label for="raAluno">
      RA
     </label>
     <input id="raAluno" placeholder="Digite o RA" required="" th:field="*{raAluno}" type="text"/>
    </div>
    <div class="field">
     <label for="curso">
      Curso
     </label>
     <select id="curso" required="" th:field="*{curso}">
      <option disabled="" value="">
       Selecione um curso
      </option>
      <option th:each="curso : ${cursos}" th:text="${curso.nomeCurso}" th:value="${curso.idCurso}">
      </option>
     </select>
    </div>
    <div class="form-actions">
     <input class="botao" type="submit" value="Salvar Aluno"/>
     <a class="voltar" href="/alunos/listar">
      Cancelar
     </a>
    </div>
   </form>
   <div th:replace="~{fragments/layout :: credit}">
   </div>
  </main>
 </body>
</html>
