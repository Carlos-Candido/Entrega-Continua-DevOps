<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   FatecADS - Sistema Acadêmico
  </title>
  <link href="/css/app.css" rel="stylesheet" th:href="@{/css/app.css}"/>
 </head>
 <body class="auth-page">
  <main class="container" id="main-content">
   <a class="brand" href="/fatecads">
    <img alt="" aria-hidden="true" class="icon brand-mark" height="32" src="/images/fatecads-mark.svg" th:src="@{/images/fatecads-mark.svg}" width="32"/>
    FatecADS
   </a>
   <h1>
    Sua vida acadêmica, organizada em um só lugar.
   </h1>
   <h2>
    Um ambiente institucional claro para quem estuda, organiza e constrói o próximo capítulo.
   </h2>
   <form action="/login" method="get">
    <button type="submit">
     Entrar no Sistema
    </button>
   </form>
   <form action="/usuarios/cadastro" method="get">
    <button class="btn-cadastro" type="submit">
     Criar uma Conta
    </button>
   </form>
   <div class="linha">
   </div>
   <div class="footer">
    FatecADS • Sistema Acadêmico
   </div>
   <div th:replace="~{fragments/layout :: credit}">
   </div>
  </main>
 </body>
</html>
